[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-is-all-you-need"
version = "0.1.0"
description = "Command and control CLI for C++ performance-RL pipelines on rLLM, SkyRL, and Google Cloud."
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "gdown>=5.2",
    "google-auth[requests]>=2.29",
    "huggingface-hub>=0.24",
    "pydantic>=2.7",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
    "rich>=13.7",
    "tomli>=2.0 ; python_version < '3.11'",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
cpp-perf = [
    "pyarrow>=14.0",
]
sft = [
    "accelerate>=1.6",
    "datasets>=3.0",
    "peft>=0.15",
    "Pillow>=10.0",
    "mlflow>=2.12,<4",
    "qwen-vl-utils>=0.0.8",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.51",
    "wandb>=0.17",
]

[project.scripts]
w8-biayn = "w8_biayn.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/w8_biayn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
