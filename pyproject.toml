[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glm47-h100-posttraining"
version = "0.1.0"
description = "GLM-4.7-Flash SFT and GRPO on 8x NVIDIA H100 with Miles."
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.34",
    "pydantic>=2.7",
    "wandb>=0.17",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[tool.hatch.build]
exclude = [
    "/.*",
    "/wandb",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glm47_posttraining"]

[tool.ruff]
line-length = 100
