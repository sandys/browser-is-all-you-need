[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-is-all-you-need"
version = "0.1.0"
description = "Command and control CLI for SLIME-based C++ performance-RL pipelines."
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "gdown>=5.2",
    "google-auth[requests]>=2.29",
    "huggingface-hub>=0.24",
    "pydantic>=2.7",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
    "rich>=13.7",
    "tomli>=2.0 ; python_version < '3.11'",
    "typer>=0.12",
    "sentencepiece",
    "tiktoken",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
cpp-perf = [
    "pyarrow>=14.0",
]
cloud = [
    "skypilot-nightly[gcp]==1.0.0.dev20260516",
    # W&B observability: launcher pipeline-outcome reporting + the
    # `w8-biayn wandb workspace` saved-view template.
    "wandb>=0.19,<0.22",
    "wandb-workspaces>=0.1.12,<0.2",
]

[project.scripts]
w8-biayn = "w8_biayn.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/w8_biayn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
