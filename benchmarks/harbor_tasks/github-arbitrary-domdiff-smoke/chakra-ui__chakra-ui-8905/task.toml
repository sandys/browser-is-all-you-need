version = "1.0"

[metadata]
instance_id = "chakra-ui__chakra-ui-8905"
difficulty = 5
language = "typescript"
build_system = "pnpm"

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 600
allow_internet = true

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 120

[verifier.env]
SERVE_CMD = "pnpm storybook -- --host 0.0.0.0 --no-open --disable-telemetry"
SERVE_PORT = "6006"
PREVIEW_PATH = "/iframe.html?id=typography-heading--basic&viewMode=story"
REBUILD_CMD = "pnpm clean:storybook"
OUTPUT_DIR = ""
CHROMIUMRL_ELIGIBLE = "true"
CHROMIUMRL_API_URL = ""
READY_PROBE = ""
READY_TIMEOUT_SEC = "60"
SLOT_SAFE_SERVE_CMD = ""
READINESS_MODE = "http"
READY_LOG_PATTERN = ""

[solution]
repo = "chakra-ui/chakra-ui"
base_commit = "bc92c21762dded58134093e7d5bec5d366caced9"
head_commit = "05eebf8aec409fe8e313d643f3016b0d9778c1ef"
pr_url = "https://github.com/chakra-ui/chakra-ui/pull/8905"
