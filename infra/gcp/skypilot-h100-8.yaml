name: glm47-h100-8

workdir: .

num_nodes: 1

resources:
  infra: gcp/us-central1
  instance_type: a3-highgpu-8g
  accelerators: H100:8
  use_spot: false
  disk_size: 500
  disk_tier: high
  labels:
    managed-by: skypilot
    workload: glm47-posttraining

envs:
  GLM47_GCP_MODELS_BUCKET: transformer-tales-glm47-models
  GLM47_GCP_ASSETS_BUCKET: transformer-tales-glm47-assets
  GLM47_GCP_RUNS_BUCKET: transformer-tales-glm47-runs

secrets:
  WANDB_API_KEY: null

# The training task does not need credentials for nested SkyPilot operations.
api_server_access: false

file_mounts:
  /root/models:
    source: gs://${GLM47_GCP_MODELS_BUCKET}
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RO
    config:
      mount_cached:
        vfs_cache_max_size: 100G
  /workspace/assets:
    source: gs://${GLM47_GCP_ASSETS_BUCKET}
    mode: MOUNT_CACHED
    type: DATASET_RO
    config:
      mount_cached:
        vfs_cache_max_size: 50G
  /workspace/runs:
    source: gs://${GLM47_GCP_RUNS_BUCKET}
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RW
    config:
      mount_cached:
        vfs_cache_max_size: 200G

# Supply the verified public GHCR digest at launch:
# sky launch infra/gcp/skypilot-h100-8.yaml \
#   --image-id docker:ghcr.io/<owner>/glm47-runtime@sha256:<digest>
