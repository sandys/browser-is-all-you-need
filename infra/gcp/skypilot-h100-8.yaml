name: glm47-h100-8

workdir: .

num_nodes: 1

resources:
  infra: gcp/us-central1
  instance_type: a3-highgpu-8g
  accelerators: H100:8
  use_spot: false
  disk_size: 500
  disk_tier: high
  autostop:
    idle_minutes: 15
    down: true
    wait_for: jobs
  labels:
    managed-by: skypilot
    workload: glm47-posttraining

envs:
  GLM47_GCP_MODELS_BUCKET: transformer-tales-glm47-models
  GLM47_GCP_ASSETS_BUCKET: transformer-tales-glm47-assets
  GLM47_GCP_RUNS_BUCKET: transformer-tales-glm47-runs
  GLM47_STAGE: null
  MILES_RUN_ID: null
  GLM47_SOURCE_COMMIT: null
  GLM47_RUNTIME_IMAGE: null
  GLM47_MODEL_REVISION: 7dd20894a642a0aa287e9827cb1a1f7f91386b67
  MILES_HF_CHECKPOINT: /root/models/GLM-4.7-Flash
  MILES_REF_LOAD_DIR: /root/models/GLM-4.7-Flash_torch_dist_tp4_pp1_ep8
  MILES_CPP_TASKS_DIR: /workspace/assets/data/tasks
  GLM47_GRPO_ADAPTER_PATH: /workspace/assets/adapters/sft
  MILES_LORA_ADAPTER_PATH: ""
  GLM47_CPP_SANDBOX_BACKEND: local
  GLM47_CPP_SANDBOX_UNSHARE_NET: "1"

secrets:
  WANDB_API_KEY: null

# The training task does not need credentials for nested SkyPilot operations.
api_server_access: false

config:
  hooks:
    - run: sync
      events: [down]
      timeout: 60

file_mounts:
  /root/models:
    source: gs://${GLM47_GCP_MODELS_BUCKET}
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RO
    config:
      mount_cached:
        vfs_cache_max_size: 100G
  /workspace/assets:
    source: gs://${GLM47_GCP_ASSETS_BUCKET}
    mode: MOUNT_CACHED
    type: DATASET_RO
    config:
      mount_cached:
        vfs_cache_max_size: 50G
  /workspace/runs:
    source: gs://${GLM47_GCP_RUNS_BUCKET}
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RW
    config:
      mount_cached:
        vfs_cache_max_size: 200G

setup: |
  set -euo pipefail

  python3 -m pip install --no-deps -e .
  python3 scripts/check_runtime.py

  command -v nvidia-smi >/dev/null
  command -v g++ >/dev/null
  command -v bwrap >/dev/null

  mapfile -t gpu_names < <(nvidia-smi --query-gpu=name --format=csv,noheader)
  if [ "${#gpu_names[@]}" -ne 8 ]; then
    echo "Expected exactly 8 GPUs, found ${#gpu_names[@]}." >&2
    exit 2
  fi
  for gpu_name in "${gpu_names[@]}"; do
    if [[ "${gpu_name}" != *H100* ]]; then
      echo "Expected H100 GPUs, found: ${gpu_name}" >&2
      exit 2
    fi
  done

  test -f "${MILES_HF_CHECKPOINT}/config.json"
  test -f "${MILES_HF_CHECKPOINT}/MODEL_REVISION"
  actual_model_revision="$(tr -d '[:space:]' < "${MILES_HF_CHECKPOINT}/MODEL_REVISION")"
  if [ "${actual_model_revision}" != "${GLM47_MODEL_REVISION}" ]; then
    echo "Model revision mismatch: expected ${GLM47_MODEL_REVISION}, found ${actual_model_revision}." >&2
    exit 2
  fi
  test -f "${MILES_REF_LOAD_DIR}/latest_checkpointed_iteration.txt"
  test -d "${MILES_CPP_TASKS_DIR}"
  test -w /workspace/runs
  test -n "${WANDB_API_KEY}"

  python3 -m glm47_posttraining.integrations.miles_aider_polyglot preflight
  echo "GLM47_SKYPILOT_PREFLIGHT_READY"

run: bash infra/gcp/run-stage.sh

# Supply the verified public GHCR digest at launch:
# sky launch infra/gcp/skypilot-h100-8.yaml \
#   --image-id "${GLM47_RUNTIME_IMAGE}"
