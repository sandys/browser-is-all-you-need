# One-update, full-load SFT canary for issue #111. Infra owns provisioning,
# local staging, preservation, and teardown; the experiment and trainer remain
# in examples/ and scripts/.
name: issue111-bank-imitation-canary

workdir: .

num_nodes: 1

resources:
  infra: gcp/us-central1
  instance_type: a3-highgpu-8g
  accelerators: H100:8
  image_id: docker:ghcr.io/tokenbender/glm47-runtime@sha256:b4f67ba1519bf276fe1dcb6fcb457600e4a256bc0d5c3011fcbd9cc05f240d43
  use_spot: true
  disk_size: 500
  disk_tier: high
  autostop:
    idle_minutes: 30
    down: true
    wait_for: jobs
  labels:
    managed-by: skypilot
    workload: issue111-bank-imitation-canary

envs:
  MILES_RUN_ID: null
  GLM47_SOURCE_COMMIT: null
  GLM47_RUNTIME_IMAGE: docker:ghcr.io/tokenbender/glm47-runtime@sha256:b4f67ba1519bf276fe1dcb6fcb457600e4a256bc0d5c3011fcbd9cc05f240d43
  GLM47_MODEL_REVISION: 7dd20894a642a0aa287e9827cb1a1f7f91386b67
  MILES_HF_CHECKPOINT: /workspace/local-models/GLM-4.7-Flash
  MILES_REF_LOAD_DIR: /workspace/local-checkpoints/GLM-4.7-Flash_torch_dist_tp4_pp1_ep8
  MILES_LORA_SOURCE_ADAPTER_PATH: /workspace/assets/checkpoints/glm47-synth-v1-100ep/checkpoints/iter_0000649/adapter
  MILES_LORA_ADAPTER_PATH: /workspace/local-checkpoints/synth-v1-ep50-hybrid
  MILES_EXPECTED_SOURCE_ADAPTER_SHA256: 4acb7f23c295f45380155c5d9ee6bc59422262f0cb51f0c02f7e550d405b575a
  MILES_EXPECTED_SOURCE_TENSORS: "9741"
  MILES_EXPECTED_STRIPPED_TENSORS: "207"
  MILES_EXPECTED_SOURCE_NATIVE_SHARDS: "8"
  MILES_SFT_NUM_EPOCH: "1"
  MILES_ROLLOUT_BATCH_SIZE: "8"
  MILES_GLOBAL_BATCH_SIZE: "8"
  MILES_SAVE_INTERVAL: "1"
  MILES_SEQ_LENGTH: "6144"
  MILES_MAX_TOKENS_PER_GPU: "12288"
  MILES_LR: "1e-5"
  MILES_RECOMPUTE_GRANULARITY: full
  MILES_RAY_SCOPED_CLEANUP: "1"
  MILES_RAY_PORT: "6479"
  MILES_RAY_DASHBOARD_PORT: "8280"
  MILES_RAY_AGENT_LISTEN_PORT: "52415"
  MILES_RAY_AGENT_GRPC_PORT: "52416"
  MILES_RAY_RUNTIME_ENV_AGENT_PORT: "52417"
  MILES_RAY_METRICS_EXPORT_PORT: "52418"
  MILES_RAY_SUBMIT_RETRIES: "5"
  WANDB_MODE: offline
  MILES_WANDB_PROJECT: glm47-bank-account-official-imitation
  MILES_WANDB_JOB_TYPE: sft-canary
  WANDB_JOB_TYPE: sft-canary
  WANDB_TAGS: bank-account,official-imitation,gcp,skypilot,8xh100,canary,issue-111

api_server_access: false

config:
  docker:
    run_options:
    - --volume=/tmp:/tmp

file_mounts:
  /workspace/models:
    source: gs://skypilot-filemounts-ubuntu-f0048940-17eetwow
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RO
    config:
      mount_cached:
        vfs_cache_max_size: 100G
  /workspace/assets:
    source: gs://skypilot-filemounts-ubuntu-f0048940-4e9fav0c
    mode: MOUNT_CACHED
    type: DATASET_RO
    config:
      mount_cached:
        vfs_cache_max_size: 25G
  /workspace/runs:
    source: gs://skypilot-filemounts-ubuntu-f0048940-88p8zkcq
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RW
    config:
      mount_cached:
        vfs_cache_max_size: 200G

setup: |
  set -euo pipefail
  : "${MILES_RUN_ID:?MILES_RUN_ID is required}"
  : "${GLM47_SOURCE_COMMIT:?GLM47_SOURCE_COMMIT is required}"
  python3 -m pip install --no-deps -e .
  python3 scripts/check_runtime.py
  apt-get update
  DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confold install -y --no-install-recommends rsync

  mapfile -t gpu_names < <(nvidia-smi --query-gpu=name --format=csv,noheader)
  test "${#gpu_names[@]}" -eq 8
  for gpu_name in "${gpu_names[@]}"; do [[ "${gpu_name}" == *H100* ]]; done

  mkdir -p /workspace/local-models /workspace/local-checkpoints /workspace/local-runs
  rsync -a /workspace/models/GLM-4.7-Flash/ "${MILES_HF_CHECKPOINT}/"
  test "$(tr -d '[:space:]' < "${MILES_HF_CHECKPOINT}/MODEL_REVISION")" = "${GLM47_MODEL_REVISION}"
  rsync -a /workspace/runs/shared/GLM-4.7-Flash_torch_dist_tp4_pp1_ep8/ "${MILES_REF_LOAD_DIR}/"
  test -f "${MILES_REF_LOAD_DIR}/latest_checkpointed_iteration.txt"

  test "$(sha256sum "${MILES_LORA_SOURCE_ADAPTER_PATH}/adapter_model.bin" | awk '{print $1}')" = "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}"
  test "$(find "${MILES_LORA_SOURCE_ADAPTER_PATH}" -maxdepth 1 -type f -name 'adapter_megatron_tp*_pp0_ep*.pt' | wc -l)" -eq "${MILES_EXPECTED_SOURCE_NATIVE_SHARDS}"
  if [ ! -f "${MILES_LORA_ADAPTER_PATH}/mtp_strip_manifest.json" ]; then
    test ! -e "${MILES_LORA_ADAPTER_PATH}" || test -z "$(find "${MILES_LORA_ADAPTER_PATH}" -mindepth 1 -print -quit)"
    python3 scripts/prepare_grpo_adapter.py \
      --include-native \
      --expected-native-shards "${MILES_EXPECTED_SOURCE_NATIVE_SHARDS}" \
      --expected-source-sha256 "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}" \
      --expected-source-tensors "${MILES_EXPECTED_SOURCE_TENSORS}" \
      --expected-stripped-tensors "${MILES_EXPECTED_STRIPPED_TENSORS}" \
      "${MILES_LORA_SOURCE_ADAPTER_PATH}" "${MILES_LORA_ADAPTER_PATH}"
  fi
  grep -q "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}" "${MILES_LORA_ADAPTER_PATH}/mtp_strip_manifest.json"
  test -w /workspace/runs
  echo ISSUE111_CANARY_SETUP_READY

run: |
  set -euo pipefail
  run_root="/workspace/local-runs/${MILES_RUN_ID}"
  artifact_root="/workspace/runs/${MILES_RUN_ID}"
  test ! -e "${run_root}"
  test ! -e "${artifact_root}"
  mkdir -p "${run_root}" "${artifact_root}"
  export MILES_RUN_ROOT="${run_root}"
  export MILES_CPP_DATA_DIR="${run_root}/data"
  export GLM47_EXPERIMENT_ID="${MILES_RUN_ID}"
  export MILES_WANDB_GROUP="${MILES_RUN_ID}"
  export MILES_WANDB_RUN_ID="${MILES_RUN_ID}"
  export WANDB_RUN_GROUP="${MILES_RUN_ID}"

  CXX=g++ PYTHONPATH=src python3 -m glm47_posttraining.integrations.miles_aider_polyglot \
    build-data \
    --tasks-dir benchmarks/cpp/bank-account-equivalent-v1 \
    --out "${MILES_CPP_DATA_DIR}" \
    --curriculum bank-account-official-drill-v1 \
    --profile bank-account-official-imitation-canary \
    --run-id "${MILES_RUN_ID}" \
    --sort-by-size \
    --force

  DATA_PATH="${MILES_CPP_DATA_DIR}/sft/train.jsonl" MODEL_PATH="${MILES_HF_CHECKPOINT}" \
    SEQ_LENGTH="${MILES_SEQ_LENGTH}" python3 - <<'PY'
  import json
  import os
  from pathlib import Path
  from transformers import AutoTokenizer

  rows = [json.loads(line) for line in Path(os.environ["DATA_PATH"]).read_text().splitlines() if line]
  if len(rows) != 8:
      raise SystemExit(f"expected 8 SFT rows, got {len(rows)}")
  tokenizer = AutoTokenizer.from_pretrained(os.environ["MODEL_PATH"], trust_remote_code=True)
  limit = int(os.environ["SEQ_LENGTH"])
  lengths = []
  target_lengths = []
  for row in rows:
      messages = row["messages"]
      full = tokenizer.apply_chat_template(messages, tokenize=True, add_generation_prompt=False)
      prompt = tokenizer.apply_chat_template(messages[:-1], tokenize=True, add_generation_prompt=True)
      lengths.append(len(full))
      target_lengths.append(max(0, len(full) - len(prompt)))
  if max(lengths) > limit or min(target_lengths) <= 0:
      raise SystemExit(
          f"serialization invalid max_tokens={max(lengths)} limit={limit} "
          f"min_target_tokens={min(target_lengths)}"
      )
  receipt = {
      "rows": len(rows),
      "sequence_length": limit,
      "min_tokens": min(lengths),
      "max_tokens": max(lengths),
      "min_target_tokens": min(target_lengths),
      "max_target_tokens": max(target_lengths),
  }
  Path(os.environ["DATA_PATH"]).with_name("serialization_preflight.json").write_text(
      json.dumps(receipt, indent=2, sort_keys=True) + "\n"
  )
  print("ISSUE111_SFT_SERIALIZATION_READY", json.dumps(receipt, sort_keys=True))
  PY

  set +e
  bash examples/sft_bank_account_official_drill.sh
  train_status=$?
  set -e

  final_adapter=""
  if [ "${train_status}" -eq 0 ]; then
    mapfile -t checkpoints < <(find "${run_root}/checkpoints/sft_lora_r16" -maxdepth 1 -type d -name 'iter_*' | sort)
    test "${#checkpoints[@]}" -eq 1
    final_adapter="${checkpoints[0]}/adapter"
    test -f "${final_adapter}/adapter_model.bin"
    test "$(grep -c 'optimizer.reload_model_params() after adapter load' "${run_root}/sft_lora_r16/run.log")" -ge 1
    ADAPTER_PATH="${final_adapter}" python3 - <<'PY'
  import hashlib
  import json
  import os
  from pathlib import Path
  import torch

  root = Path(os.environ["ADAPTER_PATH"])
  checked = 0
  nonfinite = []

  def visit(value, label):
      global checked
      if isinstance(value, torch.Tensor):
          checked += 1
          if not torch.isfinite(value).all().item():
              nonfinite.append(label)
      elif isinstance(value, dict):
          for key, item in value.items():
              visit(item, f"{label}.{key}")
      elif isinstance(value, (list, tuple)):
          for index, item in enumerate(value):
              visit(item, f"{label}[{index}]")

  files = [root / "adapter_model.bin", *sorted(root.glob("adapter_megatron_*.pt"))]
  if len(files) < 2:
      raise SystemExit("missing native adapter shards")
  for path in files:
      visit(torch.load(path, map_location="cpu", weights_only=False), path.name)
  if nonfinite:
      raise SystemExit(f"non-finite tensors: {nonfinite[:20]}")
  model = root / "adapter_model.bin"
  digest = hashlib.sha256(model.read_bytes()).hexdigest()
  receipt = {
      "status": "passed",
      "adapter_model_sha256": digest,
      "files_checked": [path.name for path in files],
      "tensors_checked": checked,
      "nonfinite_tensors": 0,
  }
  (root / "finiteness_receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
  print("ISSUE111_POST_UPDATE_FINITE", json.dumps(receipt, sort_keys=True))
  PY
  fi

  rsync -a "${run_root}/" "${artifact_root}/"
  test -f "${artifact_root}/sft_lora_r16/run.log"
  if [ -n "${final_adapter}" ]; then
    relative_adapter="${final_adapter#${run_root}/}"
    test -f "${artifact_root}/${relative_adapter}/finiteness_receipt.json"
  fi
  echo "train_status=${train_status}" > "${artifact_root}/canary_status.txt"
  echo "source_commit=${GLM47_SOURCE_COMMIT}" >> "${artifact_root}/canary_status.txt"
  echo "source_adapter_sha256=${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}" >> "${artifact_root}/canary_status.txt"
  echo "ISSUE111_CANARY_ARTIFACTS_PRESERVED ${artifact_root}"
  exit "${train_status}"
