# Infra layer: provisioning, tenancy, weight staging, stage orchestration and
# artifact sync for the issue #110 bank-account diagnostic runs. Owns every
# machine-lifecycle decision; scripts/ (train mechanism) and examples/
# (experiment profiles) must stay orthogonal to it. Launch:
#   sky launch -c <cluster> infra/gcp/skypilot-bank-account-diag.yaml \
#     --env MILES_RUN_ID=<id> --env GLM47_SOURCE_COMMIT=<sha> \
#     --workdir <clean checkout of that sha> \
#     --image-id docker:ghcr.io/tokenbender/glm47-runtime@sha256:...
name: issue110-diag10

workdir: .

num_nodes: 1

resources:
  infra: gcp/us-central1
  instance_type: a3-highgpu-8g
  accelerators: H100:8
  image_id: docker:ghcr.io/tokenbender/glm47-runtime@sha256:b4f67ba1519bf276fe1dcb6fcb457600e4a256bc0d5c3011fcbd9cc05f240d43
  use_spot: true
  disk_size: 500
  disk_tier: high
  autostop:
    idle_minutes: 30
    down: true
    wait_for: jobs
  labels:
    managed-by: skypilot
    workload: issue110-diag10

envs:
  GLM47_STAGE: grpo
  GLM47_GRPO_PROFILE: bank-account-v1
  # ---- tenancy policy (infra-owned; scripts/train_grpo.sh is mechanism) ----
  # SkyPilot's job supervisor is itself a Ray cluster on this machine, so the
  # training Ray must coexist: scoped cleanup, private session dir, and every
  # fixed Ray port moved off default (incl. agent port 52365).
  MILES_RAY_SCOPED_CLEANUP: '1'
  MILES_RAY_PORT: '6479'
  MILES_RAY_DASHBOARD_PORT: '8280'
  MILES_RAY_AGENT_LISTEN_PORT: '52415'
  MILES_RAY_AGENT_GRPC_PORT: '52416'
  MILES_RAY_RUNTIME_ENV_AGENT_PORT: '52417'
  MILES_RAY_METRICS_EXPORT_PORT: '52418'
  MILES_RAY_SUBMIT_RETRIES: '5'
  MILES_RUN_ID: null
  GLM47_SOURCE_COMMIT: null
  GLM47_RUNTIME_IMAGE: docker:ghcr.io/tokenbender/glm47-runtime@sha256:b4f67ba1519bf276fe1dcb6fcb457600e4a256bc0d5c3011fcbd9cc05f240d43
  GLM47_MODEL_REVISION: 7dd20894a642a0aa287e9827cb1a1f7f91386b67
  # Weights live on local NVMe, staged from the mounts in setup; the r3 session
  # lost time reading the 59 GB model and converted checkpoint through gcsfuse.
  MILES_HF_CHECKPOINT: /workspace/local-models/GLM-4.7-Flash
  MILES_REF_LOAD_DIR: /workspace/local-checkpoints/GLM-4.7-Flash_torch_dist_tp4_pp1_ep8
  MILES_CPP_TASKS_DIR: /root/sky_workdir/benchmarks/cpp/bank-account-equivalent-v1
  MILES_LORA_ADAPTER_PATH: /workspace/local-checkpoints/synth-v1-ep50-adapter
  MILES_AUTO_PREPARE_GRPO_ADAPTER: '1'
  MILES_EXPECTED_SOURCE_ADAPTER_SHA256: 4acb7f23c295f45380155c5d9ee6bc59422262f0cb51f0c02f7e550d405b575a
  MILES_EXPECTED_SOURCE_TENSORS: '9741'
  MILES_EXPECTED_STRIPPED_TENSORS: '207'
  MILES_EXPECTED_SOURCE_NATIVE_SHARDS: '8'
  MILES_EXPECTED_NATIVE_SHARDS: '4'
  MILES_EXPECTED_TRAIN_COUNT: '32'
  MILES_ROLLOUT_BATCH_SIZE: '32'
  MILES_N_SAMPLES_PER_PROMPT: '32'
  MILES_GLOBAL_BATCH_SIZE: '1024'
  MILES_SEQ_LENGTH: '6144'
  MILES_ROLLOUT_MAX_RESPONSE_LEN: '4096'
  MILES_EVAL_MAX_RESPONSE_LEN: '4096'
  MILES_MAX_TOKENS_PER_GPU: '12288'
  MILES_RECOMPUTE_GRANULARITY: full
  MILES_ROLLOUT_TEMPERATURE: '0.7'
  MILES_ROLLOUT_STOP_TOKEN_IDS: 154820 154827 154829
  MILES_ROLLOUT_SKIP_SPECIAL_TOKENS: '1'
  GLM47_CPP_REWARD_WORKERS: '24'
  GLM47_GATE_EXPECTED_GROUPS: '32'
  GLM47_GATE_EXPECTED_SAMPLES: '32'
  # The bounded diagnostic needs correctness contrast, not an arbitrary 30%
  # curriculum-wide density. One mixed group is the minimum useful signal.
  GLM47_GATE_MINIMUM_MIXED_FRACTION: '0.03125'
  GLM47_CPP_SANDBOX_BACKEND: docker
  GLM47_CPP_SANDBOX_IMAGE: glm47-aider-polyglot-cpp:latest
  GLM47_CPP_TSAN_PREFLIGHT_REQUIRED: '1'
  GLM47_CPP_SANDBOX_UNSHARE_NET: '1'
  WANDB_MODE: offline
  MILES_WANDB_PROJECT: glm47-bank-account-execution-rl
  WANDB_TAGS: bank-account,gcp,skypilot,8xh100,diag10,issue-110

api_server_access: false

config:
  docker:
    run_options:
    - --volume=/var/run/docker.sock:/var/run/docker.sock
    - --volume=/tmp:/tmp

file_mounts:
  /workspace/models:
    source: gs://skypilot-filemounts-ubuntu-f0048940-17eetwow
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RO
    config:
      mount_cached:
        vfs_cache_max_size: 100G
  /workspace/assets:
    source: gs://skypilot-filemounts-ubuntu-f0048940-4e9fav0c
    mode: MOUNT_CACHED
    type: DATASET_RO
    config:
      mount_cached:
        vfs_cache_max_size: 25G
  /workspace/runs:
    source: gs://skypilot-filemounts-ubuntu-f0048940-88p8zkcq
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RW
    config:
      mount_cached:
        vfs_cache_max_size: 200G

setup: |
  set -euo pipefail
  python3 -m pip install --no-deps -e .
  python3 scripts/check_runtime.py
  apt-get update
  DEBIAN_FRONTEND=noninteractive dpkg --force-confold --configure -a
  DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confold install -y --no-install-recommends docker.io rsync
  command -v nvidia-smi >/dev/null
  command -v g++ >/dev/null
  command -v docker >/dev/null
  test -S /var/run/docker.sock
  docker info >/dev/null
  mapfile -t gpu_names < <(nvidia-smi --query-gpu=name --format=csv,noheader)
  test "${#gpu_names[@]}" -eq 8
  for gpu_name in "${gpu_names[@]}"; do [[ "${gpu_name}" == *H100* ]]; done
  # ---- stage all weights to local NVMe (the r3 lesson: never train off gcsfuse) ----
  mkdir -p /workspace/local-models /workspace/local-checkpoints /workspace/local-runs
  rsync -a /workspace/models/GLM-4.7-Flash/ /workspace/local-models/GLM-4.7-Flash/
  test -f "${MILES_HF_CHECKPOINT}/config.json"
  test "$(tr -d '[:space:]' < "${MILES_HF_CHECKPOINT}/MODEL_REVISION")" = "${GLM47_MODEL_REVISION}"
  rsync -a /workspace/runs/shared/GLM-4.7-Flash_torch_dist_tp4_pp1_ep8/ /workspace/local-checkpoints/GLM-4.7-Flash_torch_dist_tp4_pp1_ep8/
  test -f "${MILES_REF_LOAD_DIR}/latest_checkpointed_iteration.txt"
  rsync -a /workspace/assets/checkpoints/glm47-synth-v1-100ep/checkpoints/iter_0000649/adapter/ /workspace/local-checkpoints/synth-v1-ep50-adapter/
  test "$(sha256sum "${MILES_LORA_ADAPTER_PATH}/adapter_model.bin" | awk '{print $1}')" = "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}"
  ls "${MILES_LORA_ADAPTER_PATH}"/adapter_megatron_tp*_pp0_ep*.pt | wc -l | grep -qx 8
  test -w /workspace/runs
  python3 -m glm47_posttraining.integrations.miles_aider_polyglot build-image --image "${GLM47_CPP_SANDBOX_IMAGE}"
  python3 -m glm47_posttraining.integrations.miles_aider_polyglot preflight
  echo GLM47_SKYPILOT_PREFLIGHT_READY

run: |
  set -euo pipefail
  # Set here, not in sky envs: sky's env templating mangles brace-bearing JSON.
  export MILES_APPLY_CHAT_TEMPLATE_KWARGS='{"enable_thinking": false}'
  parent_id="${MILES_RUN_ID}"
  artifact_root="/workspace/runs/${parent_id}"
  mkdir -p "${artifact_root}"
  # Local stage roots are scratch (artifacts sync to GCS per stage); a retry
  # must not trip the staging tool's refusal to overwrite nonempty outputs.
  rm -rf "/workspace/local-runs/${parent_id}-gate" "/workspace/local-runs/${parent_id}" "/workspace/local-runs/${parent_id}-close"

  sync_stage() {
    mkdir -p "${artifact_root}/$2"
    rsync -a "$1/" "${artifact_root}/$2/" || true
  }

  run_stage() {
    local stage_id="$1"; shift
    export MILES_RUN_ID="${stage_id}"
    export MILES_RUN_ROOT="/workspace/local-runs/${stage_id}"
    export MILES_CPP_DATA_DIR="${MILES_RUN_ROOT}/data"
    export GLM47_EXPERIMENT_ID="${stage_id}"
    export MILES_WANDB_GROUP="${parent_id}"
    export MILES_WANDB_RUN_ID="${stage_id}"
    mkdir -p "${MILES_RUN_ROOT}"
    "$@"
  }

  # ---- stage 1: no-update admission gate on the healthy sandbox ----
  set +e
  ( run_stage "${parent_id}-gate" \
      env MILES_ROLLOUT_ONLY=1 MILES_NUM_ROLLOUT=1 MILES_EVAL_INTERVAL=-1 \
          MILES_NO_REF=1 GLM47_TIMING_STATUS=rollout-only \
          MILES_WANDB_JOB_TYPE=rollout-only WANDB_JOB_TYPE=rollout-only \
      bash examples/grpo_bank_account.sh )
  gate_stage_status=$?
  set -e
  sync_stage "/workspace/local-runs/${parent_id}-gate" "gate"
  if [ "${gate_stage_status}" -ne 0 ]; then
    echo "DIAG10_GATE_STAGE_FAILED status=${gate_stage_status}"; exit "${gate_stage_status}"
  fi
  set +e
  python3 scripts/rl_curriculum/finalize_bank_account_rollout.py "/workspace/local-runs/${parent_id}-gate"
  gate_status=$?
  set -e
  sync_stage "/workspace/local-runs/${parent_id}-gate" "gate"
  if [ "${gate_status}" -ne 0 ]; then
    echo "DIAG10_ADMISSION_GATE_RED status=${gate_status}"; exit "${gate_status}"
  fi
  echo "DIAG10_ADMISSION_GATE_GREEN"

  # ---- stage 2: 10-step diagnostic training, no validation ----
  set +e
  ( run_stage "${parent_id}" \
      env MILES_ROLLOUT_ONLY=0 MILES_NUM_ROLLOUT=10 MILES_EVAL_INTERVAL=-1 \
          MILES_SAVE_INTERVAL=5 GLM47_TIMING_STATUS=full \
          MILES_WANDB_JOB_TYPE=grpo WANDB_JOB_TYPE=grpo \
      bash examples/grpo_bank_account.sh )
  train_status=$?
  set -e
  sync_stage "/workspace/local-runs/${parent_id}" "train"
  if [ "${train_status}" -ne 0 ]; then
    echo "DIAG10_TRAIN_FAILED status=${train_status}"; exit "${train_status}"
  fi
  echo "DIAG10_TRAIN_COMPLETE"

  # ---- stage 3: closing no-update rollout on the final checkpoint ----
  final_adapter="$(ls -d "/workspace/local-runs/${parent_id}/checkpoints/grpo_lora_r16"/iter_* | sort | tail -1)/adapter"
  echo "DIAG10_FINAL_ADAPTER ${final_adapter}"
  test -f "${final_adapter}/adapter_model.bin"
  set +e
  ( run_stage "${parent_id}-close" \
      env MILES_ROLLOUT_ONLY=1 MILES_NUM_ROLLOUT=1 MILES_EVAL_INTERVAL=-1 \
          MILES_NO_REF=1 GLM47_TIMING_STATUS=rollout-only \
          MILES_LORA_ADAPTER_PATH="${final_adapter}" \
          MILES_EXPECTED_SOURCE_ADAPTER_SHA256= MILES_EXPECTED_SOURCE_TENSORS= \
          MILES_EXPECTED_STRIPPED_TENSORS= MILES_EXPECTED_SOURCE_NATIVE_SHARDS=4 \
          MILES_WANDB_JOB_TYPE=rollout-only WANDB_JOB_TYPE=rollout-only \
      bash examples/grpo_bank_account.sh )
  close_stage_status=$?
  set -e
  sync_stage "/workspace/local-runs/${parent_id}-close" "close"
  if [ "${close_stage_status}" -ne 0 ]; then
    echo "DIAG10_CLOSE_FAILED status=${close_stage_status}"; exit "${close_stage_status}"
  fi
  set +e
  python3 scripts/rl_curriculum/finalize_bank_account_rollout.py "/workspace/local-runs/${parent_id}-close"
  close_gate=$?
  set -e
  sync_stage "/workspace/local-runs/${parent_id}-close" "close"
  echo "DIAG10_ALL_STAGES_DONE close_gate=${close_gate}"
