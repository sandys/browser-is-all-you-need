name: issue111-fixed26-mt2-v2

workdir: .

num_nodes: 1

resources:
  infra: gcp/us-central1
  instance_type: a3-highgpu-8g
  accelerators: H100:8
  image_id: docker:ghcr.io/tokenbender/glm47-runtime@sha256:b4f67ba1519bf276fe1dcb6fcb457600e4a256bc0d5c3011fcbd9cc05f240d43
  use_spot: true
  disk_size: 500
  disk_tier: high
  autostop:
    idle_minutes: 30
    down: true
    wait_for: jobs
  labels:
    managed-by: skypilot
    workload: issue111-fixed26-mt2-v2

api_server_access: false

config:
  docker:
    run_options:
    - --volume=/var/run/docker.sock:/var/run/docker.sock
    - --volume=/tmp:/tmp

file_mounts:
  /workspace/models:
    source: gs://skypilot-filemounts-ubuntu-f0048940-17eetwow
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RO
    config:
      mount_cached:
        vfs_cache_max_size: 100G
  /workspace/runs:
    source: gs://skypilot-filemounts-ubuntu-f0048940-88p8zkcq
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RW
    config:
      mount_cached:
        vfs_cache_max_size: 200G
  /opt/fixed26/eval_runner.py: results/execution-midband-rl-v2/method/gcp-eval-runner.py
  /opt/fixed26/aider_fixed26_contract_overlay.py: results/execution-midband-rl-v2/method/aider_fixed26_contract_overlay.py
  /opt/fixed26/aider_fixed26_originals.json: results/execution-midband-rl-v2/method/aider_fixed26_originals.json

setup: |
  set -euo pipefail
  python3 -m pip install --no-deps -e .
  python3 scripts/check_runtime.py
  apt-get update
  DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confold install -y --no-install-recommends docker.io rsync
  command -v docker >/dev/null
  test -S /var/run/docker.sock
  docker info >/dev/null

  mkdir -p /workspace/local-models /workspace/local-fixed26/runs
  rsync -a /workspace/models/GLM-4.7-Flash/ /workspace/local-models/GLM-4.7-Flash/

  source_adapter=/workspace/runs/execution-bank-RL-v2-think-r2/checkpoints/grpo_lora_r16/iter_0000019/adapter
  local_adapter=/workspace/local-fixed26/runs/execution-bank-RL-v2-think-r2/checkpoints/grpo_lora_r16/iter_0000019/adapter
  mkdir -p "$(dirname "${local_adapter}")"
  rsync -a "${source_adapter}/" "${local_adapter}/"
  python3 scripts/prepare_grpo_adapter.py \
    --expected-source-sha256 f5c298f5554c6f5fa4a27f3329e4a08c6c2fef76834c0f10147a270ede41148d \
    --expected-source-tensors 9741 \
    --expected-stripped-tensors 207 \
    "${local_adapter}" "${local_adapter%/adapter}/adapter-fixed26-serving"

run: |
  set -euo pipefail
  python3 /opt/fixed26/eval_runner.py
